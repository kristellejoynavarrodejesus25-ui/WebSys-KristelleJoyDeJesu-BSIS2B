<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 CSS Lab</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>

    <!-- Controls / Interactive Lab Tools -->
    <section class="controls" aria-label="User Controls">
        <p id="heading">Welcome to My Webpage</p>

        <button id="themeToggle" type="button">Switch Theme</button>

        <div class="task-manager">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button id="addTask" type="button">Add Task</button>
            <ul id="taskList"></ul>
        </div>
    </section>

    <!-- Modal Dialog -->
    <div id="modal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button id="closeModal" type="button">Close</button>
        </div>
    </div>

    <!-- Main Navigation Header -->
    <header>
        <h1>My CSS Web Page</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>Welcome to our website! This section introduces our company and its values.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <p>We offer a range of services designed to meet your needs.</p>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <form action="#" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <!-- Site Footer -->
    <footer>
        <p>&copy; 2026 UniSpace</p>
    </footer>

</body>

</html>
